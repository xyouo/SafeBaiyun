name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build.yml"
      - "app/**"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "settings.gradle.kts"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Get version
        id: version
        run: |
          TIMESTAMP=$(date -u +%s)
          echo "versionCode=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "versionName=3.0.${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "ver=3.0.${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PversionCode=${{ steps.version.outputs.versionCode }} -PversionName=${{ steps.version.outputs.versionName }}

      - name: Rename APK files
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/SafeBaiyun-${{ steps.version.outputs.ver }}.apk"

      - name: Upload APK to v3.0 release
        run: |
          gh release view v3.0 -R ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create v3.0 -R ${{ github.repository }} --title "v3.0" --notes "SafeBaiyun v3.0"
          gh release upload v3.0 app/build/outputs/apk/debug/SafeBaiyun-${{ steps.version.outputs.ver }}.apk -R ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep latest APK asset
        run: |
          gh release view v3.0 -R ${{ github.repository }} --json assets \
            --jq '.assets | map(select(.name | test("^SafeBaiyun-3\\.0\\.[0-9]+\\.apk$"))) | sort_by(.createdAt) | reverse | .[1:] | .[].name' \
            | while read -r asset; do
                [ -n "$asset" ] && gh release delete-asset v3.0 "$asset" -R ${{ github.repository }} -y
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

